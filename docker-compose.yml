# Deployment shape for every Facile Go service. `scripts/rename.sh` rewrites the
# slug and the module path on fork; the routing below is what must NOT change.
#
# The suite standard is ONE container and ONE public hostname per app:
#
#   <app>.facile.studio        -> the Go binary, which serves both halves
#   <app>.facile.studio/api/*  -> the API routes, mounted under router.Route("/api", ...)
#   everything else            -> the built SvelteKit SPA, served by tronc/spa
#
# There is no client container and no second Traefik router. The root `Dockerfile`
# builds the client with bun, builds the API with Go, and copies both into one
# distroless image: the binary at /api, the SPA at /client. `spa.DirFromEnv()`
# reads CLIENT_DIR and falls back to ./client, which resolves to /client in the
# image, so nothing has to be configured here.
#
# Consequences, all of them deliberate:
#
#   - No PathPrefix and no stripprefix. A single router takes the whole host and
#     the Go router decides what is API and what is SPA. The routes live under
#     /api in main.go, so the prefix must reach the binary intact - putting a
#     stripprefix middleware back would 404 every route.
#   - Every browser request is same-origin, so CORS is unnecessary in production,
#     cookies stay first-party in Safari, and the client build carries no
#     environment-specific API URL. The client calls `/api`, relative, always.
#   - The service is `expose`d and never `ports`-published: only Traefik reaches
#     it, over the shared dokploy-network.
#
# Compose labels REPLACE what Dokploy injects for a service, they do not merge
# with it. Declaring labels here therefore takes full ownership of this service's
# routing, which is exactly what we want.
#
# Prisme is the one fork with a second public service, and it is not a second
# app container: Synapse, the Matrix homeserver, answers /_matrix and
# /_synapse/client on the same hostname. Its router carries a higher priority
# so those paths reach it; everything else still reaches the one app container.
# Synapse is never published by port and federation is off.

services:
  db:
    build:
      context: deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-prisme}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  synapse:
    build:
      context: deploy/synapse
    restart: unless-stopped
    expose:
      - "8008"
    networks:
      - default
      - dokploy-network
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-prisme.facile.studio}
      MATRIX_PUBLIC_URL: ${MATRIX_PUBLIC_URL:-https://prisme.facile.studio}
      SYNAPSE_DB_HOST: db
      SYNAPSE_DB_USER: ${POSTGRES_USER:-postgres}
      SYNAPSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SYNAPSE_DB_NAME: synapse
      SYNAPSE_SIGNING_KEY: ${SYNAPSE_SIGNING_KEY:?SYNAPSE_SIGNING_KEY is required}
      SYNAPSE_MACAROON_SECRET: ${SYNAPSE_MACAROON_SECRET:?SYNAPSE_MACAROON_SECRET is required}
      SYNAPSE_FORM_SECRET: ${SYNAPSE_FORM_SECRET:?SYNAPSE_FORM_SECRET is required}
      PRISME_AS_TOKEN: ${PRISME_AS_TOKEN:?PRISME_AS_TOKEN is required}
      PRISME_HS_TOKEN: ${PRISME_HS_TOKEN:?PRISME_HS_TOKEN is required}
    volumes:
      - synapse_data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.prisme-matrix-web.rule: "Host(`prisme.facile.studio`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse/client`))"
      traefik.http.routers.prisme-matrix-web.priority: "100"
      traefik.http.routers.prisme-matrix-web.entrypoints: web
      traefik.http.routers.prisme-matrix-web.middlewares: redirect-to-https@file
      traefik.http.routers.prisme-matrix-web.service: prisme-matrix-svc
      traefik.http.routers.prisme-matrix-secure.rule: "Host(`prisme.facile.studio`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse/client`))"
      traefik.http.routers.prisme-matrix-secure.priority: "100"
      traefik.http.routers.prisme-matrix-secure.entrypoints: websecure
      traefik.http.routers.prisme-matrix-secure.tls.certresolver: letsencrypt
      traefik.http.routers.prisme-matrix-secure.service: prisme-matrix-svc
      traefik.http.services.prisme-matrix-svc.loadbalancer.server.port: "8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.prisme-web.rule: "Host(`prisme.facile.studio`)"
      traefik.http.routers.prisme-web.entrypoints: web
      traefik.http.routers.prisme-web.middlewares: redirect-to-https@file
      traefik.http.routers.prisme-web.service: prisme-svc
      traefik.http.routers.prisme-secure.rule: "Host(`prisme.facile.studio`)"
      traefik.http.routers.prisme-secure.entrypoints: websecure
      traefik.http.routers.prisme-secure.tls.certresolver: letsencrypt
      traefik.http.routers.prisme-secure.service: prisme-svc
      traefik.http.services.prisme-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prisme}?sslmode=disable
      PORT: "4000"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://prisme.facile.studio}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SSO_ONLY: ${SSO_ONLY:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_MACHINE_AUDIENCE: ${OIDC_MACHINE_AUDIENCE:-}
      MATRIX_INTERNAL_URL: http://synapse:8008
      MATRIX_PUBLIC_URL: ${MATRIX_PUBLIC_URL:-https://prisme.facile.studio}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-prisme.facile.studio}
      PRISME_AS_TOKEN: ${PRISME_AS_TOKEN}
      PRISME_SECRET_KEY: ${PRISME_SECRET_KEY:?PRISME_SECRET_KEY is required}
      PRISME_SERVICE_KEY: ${PRISME_SERVICE_KEY:-}
      ECHO_URL: ${ECHO_URL:-}
      ECHO_INTEGRATION_KEY: ${ECHO_INTEGRATION_KEY:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: prisme_db_data
  synapse_data:
    name: prisme_synapse_data
