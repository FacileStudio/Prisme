# Local Synapse and Postgres for development. The API and the client run on
# the host (mise run dev). Every value here is a throwaway for localhost.
services:
  db:
    build:
      context: deploy/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prisme
    ports:
      - "127.0.0.1:5557:5432"
    volumes:
      - dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  synapse:
    build:
      context: deploy/synapse
    environment:
      MATRIX_SERVER_NAME: localhost
      MATRIX_PUBLIC_URL: http://localhost:18008
      SYNAPSE_DB_HOST: db
      SYNAPSE_DB_USER: postgres
      SYNAPSE_DB_PASSWORD: postgres
      SYNAPSE_MACAROON_SECRET: dev-macaroon-secret
      SYNAPSE_FORM_SECRET: dev-form-secret
      PRISME_AS_TOKEN: dev-as-token
      PRISME_HS_TOKEN: dev-hs-token
      PRISME_AS_URL: ${PRISME_AS_URL:-http://host.docker.internal:14090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18008:8008"
    volumes:
      - dev_synapse:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  dev_db:
  dev_synapse:
