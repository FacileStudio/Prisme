[tools]
go = "1.26"

[env]
GO_BIN = { value = "{{tools.go.path}}/bin/go", tools = true }

[tasks.deps]
description = "Download Go module dependencies"
sources = ["go.mod", "go.sum"]
run = '"$GO_BIN" mod download'

[tasks.build]
description = "Build the API binary at ./bin/api"
depends = [":deps"]
run = ["mkdir -p bin", '"$GO_BIN" build -o bin/api .']

[tasks.check]
description = "Check formatting, vet and test the API without modifying files"
run = "sh ../../scripts/check.sh --go-only"

[tasks.format]
description = "Format the API sources in place"
run = "sh ../../scripts/check.sh --format"

[tasks.dev]
description = "Run the API with local defaults"
depends = [":deps"]
run = '''
if [ -f .env ]; then
  set -a
  . ./.env
  set +a
fi

DATABASE_URL="${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5557/prisme?sslmode=disable}"
PORT="${PORT:-4000}"
LOG_LEVEL="${LOG_LEVEL:-info}"
CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"

echo "starting api on :$PORT"

exec env \
  DATABASE_URL="$DATABASE_URL" \
  PORT="$PORT" \
  LOG_LEVEL="$LOG_LEVEL" \
  APP_ENV="${APP_ENV:-development}" \
  CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
  MATRIX_INTERNAL_URL="${MATRIX_INTERNAL_URL:-http://127.0.0.1:18008}" \
  MATRIX_PUBLIC_URL="${MATRIX_PUBLIC_URL:-http://localhost:18008}" \
  MATRIX_SERVER_NAME="${MATRIX_SERVER_NAME:-localhost}" \
  PRISME_AS_TOKEN="${PRISME_AS_TOKEN:-dev-as-token}" \
  PRISME_SECRET_KEY="${PRISME_SECRET_KEY:-dev-secret-key-dev-secret-key-0123456789}" \
  PRISME_SERVICE_KEY="${PRISME_SERVICE_KEY:-dev-service-key}" \
  "$GO_BIN" run .
'''

[tasks.test]
description = "Run Go tests"
depends = [":deps"]
run = '"$GO_BIN" test ./...'

[tasks.tidy]
description = "Sync go.mod and go.sum"
run = '"$GO_BIN" mod tidy'
